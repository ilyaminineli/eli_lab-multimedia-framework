[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-lab-multimedia-framework"
version = "0.2.0.dev0"
description = "Production and asset-management utilities for the ELI LAB multimedia pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ilya Minin (Eli)" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow>=11.3,<13",
    "python-magic>=0.4.27,<0.5",
    "tkcalendar>=1.6.1,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/ELIASADAMS/eli_lab-multimedia-framework"
